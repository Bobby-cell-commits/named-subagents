name: Release

# Publish to PyPI and make a GitHub release when a version tag (`vX.Y.Z`) is
# pushed. PyPI uses OIDC Trusted Publishing, so no API token is stored; the
# one-time "trusted publisher" config on pypi.org is in docs/RELEASING.md.
#
# A `verify` gate runs BEFORE the publish: it re-runs every test suite, runs
# `doctor` (which cross-checks the in-repo version strings), and asserts the
# pushed tag matches that version. Publishing is irreversible, so a mistagged
# or red build must never reach the registry.

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; each job widens only what it needs.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (tests + tag/version match)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches declared version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG" != "$PY_VERSION" ]; then
            echo "::error::Pushed tag '${GITHUB_REF_NAME}' -> '${TAG}' does not match pyproject version '${PY_VERSION}'. Bump the version in pyproject.toml, named_subagents/__init__.py, .claude-plugin/plugin.json and CHANGELOG.md, then re-tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches declared version ${PY_VERSION}."

      - name: Python tests
        run: |
          python tests/test_named_subagents.py
          python tests/test_hook.py
          python tests/test_name_mode.py
          python tests/test_roster.py

      - name: Doctor (cross-checks the version strings + registry/ledger)
        run: |
          pip install --quiet .
          named-subagents doctor

  pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — the whole point of Trusted Publishing; no token stored
      contents: read # a job-level permissions block REPLACES defaults; checkout needs this
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        # No `password:` input — the action exchanges the GitHub OIDC token
        # for a short-lived PyPI credential. Configure the trusted publisher
        # on pypi.org first (docs/RELEASING.md), or the first run fails closed.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-runs: don't fail if this version is already on PyPI
          # (e.g. re-running the workflow after a GitHub-release failure).
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
      - name: Publish release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          # Extract the CHANGELOG section for this version (between its `## [x]`
          # header and the next `## [` header).
          awk -v tag="$TAG" '
            $0 ~ ("^## \\[" tag "\\]") { f=1; next }
            /^## \[/ { f=0 }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > notes.md
          fi
          gh release create "${GITHUB_REF_NAME}" --title "v${TAG}" --notes-file notes.md
